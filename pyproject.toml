[project]
name = "indlaw"
version = "0.1.0"
description = "Citation-grounded retrieval over Indian court judgments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest", "ruff"]

[project.scripts]
indlaw = "indlaw.cli:main"

[tool.setuptools]
packages = ["indlaw"]

[tool.pytest.ini_options]
addopts = "-q"
